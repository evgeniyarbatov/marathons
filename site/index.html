<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Marathon Records</title>
    <meta name="description" content="Marathon world records and best times.">
    <meta name="keywords" content="marathon records, marathon times, best marathon times, world records, running statistics, marathon database, athletic records, men marathon, women marathon">
    <meta name="author" content="Marathon Records Database">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://marathons.gritcuriosityandperseverance.org">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Marathon Records">
    <meta property="og:description" content="Marathon world records and best times.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://marathons.gritcuriosityandperseverance.org">
    <meta property="og:image" content="https://marathons.gritcuriosityandperseverance.org/og-image.jpg">
    <meta property="og:site_name" content="Marathon Records Database">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Marathon Records">
    <meta name="twitter:description" content="Marathon world records and best times.">
    <meta name="twitter:image" content="https://marathons.gritcuriosityandperseverance.org/og-image.jpg">
    
    <!-- Additional SEO Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="application-name" content="Marathon Records">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Dataset",
      "name": "Marathon Records Database",
      "description": "Comprehensive database of marathon world records, best times, and latest performances from marathons worldwide",
      "url": "https://marathons.gritcuriosityandperseverance.org",
      "keywords": ["marathon", "records", "running", "athletics", "world records", "marathon times"],
      "creator": {
        "@type": "Organization",
        "name": "Marathon Records Database"
      },
      "datePublished": "2025-01-01",
      "dateModified": "2025-01-01",
      "license": "https://creativecommons.org/licenses/by/4.0/",
      "distribution": {
        "@type": "DataDownload",
        "encodingFormat": "application/json",
        "contentUrl": "https://marathons.gritcuriosityandperseverance.org/marathons.json"
      },
      "spatialCoverage": {
        "@type": "Place",
        "name": "Worldwide"
      },
      "temporalCoverage": "1970/..",
      "variableMeasured": [
        {
          "@type": "PropertyValue",
          "name": "Marathon Time",
          "description": "Time taken to complete marathon distance"
        },
        {
          "@type": "PropertyValue", 
          "name": "Athlete Gender",
          "description": "Gender category of the athlete"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
