  <!-- Text -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="white">Marathon Records</text>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="48" font-weight="normal" text-anchor="middle" fill="white" opacity="0.9">World records and best times</text>
</svg>