name: refresh-data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make data metadata links
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      - id: commit
        run: |
          if [ -z "$(git status --porcelain -- site/public)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > site/public/last_update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public cache
          git commit -m "chore: refresh data from kaggle"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy is called directly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref }}
